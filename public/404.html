<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Page not found</title>
  <style>
    :root{color-scheme:light dark;font:16px/1.5 system-ui,sans-serif;background:#fdf7ff;color:#1d1b20}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 10%,#ffd9e3,transparent 40%)}
    main{width:min(100%,560px);border:1px solid #cac4cf;border-radius:28px;padding:clamp(32px,8vw,64px);background:#f8f2fa;box-shadow:0 2px 6px #0002;text-align:center}
    .mark{width:48px;height:48px;margin:0 auto 24px;border-radius:16px 16px 24px 16px;background:#6750a4;box-shadow:inset 0 0 0 10px #e9ddff;transform:rotate(-8deg)}
    .code{margin:0;color:#65558f;font-size:.875rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    h1{margin:8px 0;font-size:clamp(2rem,8vw,3.5rem);line-height:1.1}p{color:#49454e}a{min-height:48px;margin-top:16px;border-radius:999px;padding:0 24px;display:inline-flex;align-items:center;background:#65558f;color:#fff;font-weight:650;text-decoration:none}
    a:focus-visible{outline:3px solid #65558f;outline-offset:4px}
    @media(prefers-color-scheme:dark){:root{background:#141218;color:#e6e0e9}body{background:radial-gradient(circle at 80% 10%,#633b48,transparent 40%)}main{border-color:#49454e;background:#1d1b20}.code{color:#cfbdfe}p{color:#cac4cf}a{background:#cfbdfe;color:#36275d}}
  </style>
</head>
<body><main><div class="mark" aria-hidden="true"></div><p class="code">Error 404</p><h1>This page wandered off.</h1><p>The address may have changed, or the page may no longer be available.</p><a href="/">Return home</a></main></body>
</html>
